name: Deploy Appwrite - Houses Catalise

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'appwrite.config.json'
      - 'scripts/provision-tables.mjs'
      - 'scripts/seed-appwrite.mjs'
      - 'scripts/refresh-notices.mjs'
      - 'scripts/import-legacy-notices.mjs'
      - 'scripts/reset-pastoral-key.mjs'
      - '.github/workflows/appwrite-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appwrite CLI and SDK
        run: |
          npm install -g appwrite-cli@latest
          npm install --no-save node-appwrite@latest

      - name: Configure Appwrite CLI
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          test -n "$APPWRITE_API_KEY" || (echo "Missing APPWRITE_API_KEY" && exit 1)
          appwrite client --endpoint "https://fra.cloud.appwrite.io/v1" --project-id "6aabcd0b000c5d1298ab" --key "$APPWRITE_API_KEY"

      - name: Deploy database schema with TablesDB API
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6aabcd0b000c5d1298ab
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/provision-tables.mjs

      - name: Deploy private storage bucket
        run: appwrite push buckets --all --force

      - name: Deploy two backend functions
        shell: bash
        run: |
          set -o pipefail
          OUTPUT="$(appwrite push functions --all --force 2>&1)"
          printf '%s\n' "$OUTPUT"
          if printf '%s\n' "$OUTPUT" | grep -Eq 'Failed to push function|No functions were pushed|✗ Error'; then
            echo 'Function deployment failed.'
            exit 1
          fi

      - name: Seed initial configuration
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6aabcd0b000c5d1298ab
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          HOUSES_ADMIN_TOKEN: ${{ secrets.HOUSES_ADMIN_TOKEN }}
        run: node scripts/seed-appwrite.mjs

      - name: Apply pastoral access key
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6aabcd0b000c5d1298ab
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/reset-pastoral-key.mjs

      - name: Refresh known Sep-Oct 2026 notices
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6aabcd0b000c5d1298ab
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/refresh-notices.mjs

      - name: Recover extra October 2026 notices from legacy backend
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6aabcd0b000c5d1298ab
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/import-legacy-notices.mjs

      - name: Smoke Appwrite after deploy
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/smoke-appwrite.mjs
