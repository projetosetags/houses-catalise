name: Importar Houses para Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: houses-cloudflare-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Importar e conferir dados e arquivos privados
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          CLOUDFLARE_MIGRATION_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_TOKEN }}
        run: node cloudflare/scripts/import-appwrite.mjs
