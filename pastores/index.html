<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Houses Pastores">
<title>Houses Pastores</title>
<link rel="icon" type="image/png" href="../assets/houses-pastores-logo.png">
<link rel="apple-touch-icon" href="../assets/houses-pastores-logo.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f14;color:#fff}#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#2b2414 0,#0b0f14 45%)}.box{width:min(420px,100%);text-align:center}.logo{width:138px;height:138px;object-fit:cover;border-radius:28px;box-shadow:0 18px 50px #0008}.box h1{margin:20px 0 5px;font-size:29px}.box p{margin:0 0 22px;color:#c9c9c9}.box input{width:100%;padding:16px;border:1px solid #5d5132;border-radius:14px;background:#171717;color:#fff;font-size:17px;outline:none}.box button{width:100%;margin-top:12px;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#b88a2a,#f0d173);color:#17120a;font-weight:800;font-size:17px}.hint{font-size:12px!important;margin-top:14px!important;color:#8e8e8e!important}#app{display:none;width:100%;height:100%;border:0;background:#0b0f14}.reset{position:fixed;z-index:20;right:10px;bottom:10px;width:auto!important;padding:8px 10px!important;border-radius:10px!important;font-size:11px!important;opacity:.28;background:#111!important;color:#fff!important}.reset:hover{opacity:.8}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <img class="logo" src="../assets/houses-pastores-logo.png" alt="Houses Pastores">
    <h1>Houses Pastores</h1>
    <p>Acesso pastoral protegido</p>
    <input id="key" type="password" autocomplete="off" placeholder="Chave pastoral">
    <button id="enter" type="button">Entrar</button>
    <p class="hint">No primeiro acesso deste aparelho, informe sua chave pastoral. Depois, o acesso fica salvo somente neste dispositivo.</p>
  </div>
</div>
<iframe id="app" title="Houses Pastores"></iframe>
<button id="reset" class="reset" type="button" style="display:none">Trocar acesso</button>
<script>
const STORE='housesPastoresAccess';
const gate=document.getElementById('gate');
const app=document.getElementById('app');
const key=document.getElementById('key');
const reset=document.getElementById('reset');
function openPanel(access){
  if(!access)return;
  gate.style.display='none';
  app.style.display='block';
  reset.style.display='block';
  app.src='../admin.html?token='+encodeURIComponent(access);
}
function saveAndOpen(){
  const access=key.value.trim();
  if(!access){key.focus();return;}
  localStorage.setItem(STORE,access);
  openPanel(access);
}
document.getElementById('enter').addEventListener('click',saveAndOpen);
key.addEventListener('keydown',e=>{if(e.key==='Enter')saveAndOpen()});
reset.addEventListener('click',()=>{localStorage.removeItem(STORE);app.src='about:blank';app.style.display='none';reset.style.display='none';gate.style.display='flex';key.value='';key.focus()});
const saved=localStorage.getItem(STORE);
if(saved)openPanel(saved);
</script>
</body>
</html>
